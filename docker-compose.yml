services:
  central:
    image: distribuidos/central
    build:
      context: .
      dockerfile: dockerfile-central
    networks:
      - mynetwork
    command: ["20", "10"]
    ports:
      - 9400:9400

  Backup:
    image: distribuidos/replica
    build:
      context: .
      dockerfile: dockerfile-replica
    networks:
      - mynetwork
    command: ["20", "10", "central", "10000"]

  facultad:
    image: distribuidos/facultad
    build:
      context: .
      dockerfile: dockerfile-facultad
    networks:
      - mynetwork
    command: ["Ingeniería", "2025-1", "central", "1081", "backup"]

  programas:
    image: distribuidos/programas
    build:
      context: .
      dockerfile: dockerfile-programa
    networks:
      - mynetwork
    command: ["Ingeniería de Sistemas", "2025-1", "Ingeniería", "3", "2", "facultad:1081"]
    
  mongo:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: pass
    networks:
      - mynetwork

  prometheus:
    image: prom/prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
    networks:
      - mynetwork
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana:/etc/grafana/provisioning/datasources
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: bridge

volumes:
  grafana_data:
